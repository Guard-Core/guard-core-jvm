# Minimal overrides on top of detekt's default rule set (buildUponDefaultConfig = true).
build:
  maxIssues: 0

# Overrides driven by the W1 port surface (guard_core Python sources ported
# file-for-file). Each relaxation names the reason; anything not listed stays
# at detekt's default.
complexity:
  LongMethod:
    # Ported validators and scanners mirror Python function bodies one-to-one;
    # the config field-table dispatchers (applyTo/applyOne/assignByName) are
    # one branch per python field.
    threshold: 560
  LongParameterList:
    # ConfigFieldRegistry.FieldMeta and the fromMap applier mirror the python
    # field table (107 fields); the parameter count is the port surface.
    active: false
  CyclomaticComplexMethod:
    # Pydantic validator branches land as explicit checks; the field-table
    # dispatchers are one branch per python field.
    threshold: 250
  TooManyFunctions:
    # One Kotlin object per python module keeps the file:line mapping.
    thresholdInFiles: 60
    thresholdInClasses: 160
    thresholdInInterfaces: 60
    thresholdInObjects: 60
  LargeClass:
    # SecurityConfig mirrors the ~107-field python model.
    active: false
  NestedBlockDepth:
    # JSON parser and pair scanner recursion shapes.
    threshold: 8
  ComplexCondition:
    # Percent-escape and IP grammar conditions port as written.
    active: false

exceptions:
  TooGenericExceptionCaught:
    # Python `except Exception` boundaries port verbatim (hook/agent seams).
    active: false
  SwallowedException:
    # Python swallow-and-log paths (body reader, hooks) port verbatim.
    active: false
  RethrowCaughtException:
    # Python `raise GuardRedisError(...) from e` chaining ports verbatim
    # (redis_handler.py:179, ratelimit_handler.py:51).
    active: false
  TooGenericExceptionThrown:
    # Test fakes mirror python AsyncMock(side_effect=RuntimeError(...)).
    active: false

naming:
  MatchingDeclarationName:
    # Several files mirror one python module (PyIp.kt: IpAddress + IpNetwork).
    active: false

empty-blocks:
  EmptyFunctionBlock:
    # Protocol fakes in tests implement surface-only members.
    active: false

style:
  MagicNumber:
    # Security constants (bounds, defaults, code points) are the port surface;
    # renaming them to named constants would break python file:line parity.
    active: false
  UseRequire:
    # Python `raise ValueError(...)` guards port as IllegalArgumentException throws.
    active: false
  UseCheckOrError:
    # Python `raise RuntimeError(...)` state guards port as IllegalStateException throws.
    active: false
  MaxLineLength:
    # Warning messages stay byte-exact with the python originals.
    maxLineLength: 220
  LoopWithTooManyJumpStatements:
    # Scanner loops port python break/continue structure.
    active: false
  ReturnCount:
    # Validators return early exactly like the python originals.
    active: false
  ThrowsCount:
    # Python validators raise per rejection branch.
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateMember:
    active: false
  ProtectedMemberInFinalClass:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  UnusedPrivateProperty:
    active: false

performance:
  SpreadOperator:
    # redis-py varargs ports: conn.delete(*keys), evalsha argv spread.
    active: false
