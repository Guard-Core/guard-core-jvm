name: Release

# Publishes guard-core-engine and guard-core to Maven Central (Central Portal)
# for a release tag. Nothing is built or tested for validation here: the tagged
# commit must already have passed the push workflows listed in
# REQUIRED_WORKFLOWS (ci.yml runs the build, the full corpus certification gate,
# coverage and the dependency audit; ecosystem-gate.yml runs the consumers
# against this engine). A release can therefore never fail on a check its pull
# request did not run.
#
# Re-drive: run this workflow by hand (Actions > Release > Run workflow) with
# the tag, for example v4.4.0. It checks out that tag, so a fixed workflow on
# master can publish an existing tag. An artifact already on Maven Central is
# skipped (repo1.maven.org is authoritative). Bare vX.Y.z tags only.
#
# Auth reality (verified 2026-10-11): the Central Portal Publisher API takes
# a Portal user token (Bearer base64(username:password)); OIDC trusted
# publishing does not exist for Maven Central yet, so the publish job needs
# no id-token scope and carries the least-privilege permission set. GPG
# signing is mandatory per Portal rules; the key arrives via secrets and
# never leaves the runner. Deployments upload as USER_MANAGED: release each
# VALIDATED deployment from the Portal UI. See docs/release.md.

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v4.4.0'
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REQUIRED_WORKFLOWS: >-
    .github/workflows/ci.yml
    .github/workflows/ecosystem-gate.yml

jobs:
  verify:
    name: Tagged commit passed CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' is not of the form v1.2.3"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # The project version in build.gradle.kts is the source of truth. The
      # tag must equal it, and a SNAPSHOT version here means the release PR
      # forgot the flip (docs/release.md, version-flip checklist).
      - name: Verify the tag equals the project version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(grep -m1 'version = "' build.gradle.kts | sed 's/^.*version = "\([^"]*\)".*$/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not read the project version from build.gradle.kts"
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::project version $version is a SNAPSHOT: the release PR must flip it (docs/release.md, version-flip checklist)"
              exit 1
              ;;
          esac
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match the project version $version"
            exit 1
          fi
          echo "ok: $TAG matches the project version $version"

      # The newest push run of each required workflow on the tagged commit
      # must have succeeded. A release created right after a merge waits for
      # them (up to an hour) instead of failing.
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 60); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=push&per_page=100" \
              --jq '[.workflow_runs | group_by(.path)[] | max_by(.run_number) | {path, status, conclusion}]')
            waiting=0
            for wf in $REQUIRED_WORKFLOWS; do
              run=$(jq -c --arg p "$wf" '.[] | select(.path == $p)' <<< "$runs")
              if [ -z "$run" ]; then
                echo "$wf: no push run on $sha yet"; waiting=1; continue
              fi
              status=$(jq -r .status <<< "$run"); conclusion=$(jq -r .conclusion <<< "$run")
              if [ "$status" != "completed" ]; then
                echo "$wf: $status"; waiting=1
              elif [ "$conclusion" != "success" ]; then
                echo "::error::$wf concluded $conclusion on $sha; fix master and release a new tag"
                exit 1
              else
                echo "ok: $wf success on $sha"
              fi
            done
            [ "$waiting" = "0" ] && exit 0
            sleep 60
          done
          echo "::error::required workflows did not finish on $sha within an hour"
          exit 1

  publish:
    name: Publish to Maven Central (Central Portal)
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.verify.outputs.tag }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Gate (b): publishing credentials must be present as secrets. Gate (c):
      # GPG inputs must be present (the Portal requires .asc signatures for
      # every file; there is no signing-free path as of 2026-10).
      - name: Check publishing credentials and GPG inputs are present
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=0
          for secret in CENTRAL_PORTAL_USERNAME CENTRAL_PORTAL_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!secret}" ]; then
              echo "secret ${secret} is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Maven Central publishing needs four repository secrets:"
            echo "  CENTRAL_PORTAL_USERNAME / CENTRAL_PORTAL_PASSWORD  (Portal user token)"
            echo "  GPG_PRIVATE_KEY / GPG_PASSPHRASE                   (armored signing key)"
            echo "Setup: docs/release.md, prerequisites section."
            exit 1
          fi
          echo "ok: all four publishing secrets are present"

      # Gate (a): the pre-publish existence check. repo1.maven.org serves an
      # artifact only after it is fully live; 200 = skip, 404 = publish,
      # anything else = unknown registry state, refuse to act.
      - name: Resolve which artifacts still need publishing
        id: artifacts
        run: |
          set -euo pipefail
          version="${TAG#v}"
          code_engine=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/com/guard-core/guard-core-engine/${version}/guard-core-engine-${version}.pom" \
            || echo 000)
          code_facade=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/com/guard-core/guard-core/${version}/guard-core-${version}.pom" \
            || echo 000)
          for triple in "engine:guard-core-engine:${code_engine}" "facade:guard-core:${code_facade}"; do
            name="${triple%%:*}"
            rest="${triple#*:}"
            artifact="${rest%%:*}"
            code="${rest##*:}"
            case "$code" in
              200)
                echo "com.guard-core:${artifact} ${version} is already live on Maven Central; it will be skipped"
                echo "${name}=skip" >> "$GITHUB_OUTPUT"
                ;;
              404)
                echo "com.guard-core:${artifact} ${version} is not on Maven Central; queued to publish"
                echo "${name}=publish" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "repo1.maven.org returned HTTP ${code} for ${artifact}:${version}; refusing to publish against unknown registry state"
                exit 1
                ;;
            esac
          done

      # Engine first (the facade POM depends on it).
      - name: Build the guard-core-engine staging bundle
        if: steps.artifacts.outputs.engine == 'publish'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew :guard-core-engine:publishMavenPublicationToCentralStagingRepository --no-daemon

      - name: Upload and validate the guard-core-engine deployment
        if: steps.artifacts.outputs.engine == 'publish'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          token=$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 | tr -d '\n')
          rm -f central-bundle.zip
          (cd guard-core-engine/build/central-staging && zip -qr "$GITHUB_WORKSPACE/central-bundle.zip" .)
          deployment=""
          for attempt in 1 2 3; do
            response=$(curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer ${token}" \
              -F "bundle=@central-bundle.zip;type=application/octet-stream" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=guard-core-engine-${version}&publishingType=USER_MANAGED") \
              && deployment=$(printf '%s' "$response" | tr -d '[:space:]') && break
            echo "upload attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          if [ -z "$deployment" ] || [ "$deployment" = "null" ]; then
            echo "guard-core-engine upload failed after 3 attempts"
            exit 1
          fi
          echo "guard-core-engine deployment: ${deployment}"
          for _ in $(seq 1 30); do
            state=$(curl -sS -X POST \
              -H "Authorization: Bearer ${token}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment}" | jq -r '.deploymentState' || true)
            echo "validation state: ${state}"
            case "$state" in
              VALIDATED)
                echo "guard-core-engine ${version} is VALIDATED; release it from the Portal UI (Deployments)"
                echo "$deployment" > guard-core-engine-deployment-id.txt
                exit 0
                ;;
              PUBLISHED)
                echo "guard-core-engine ${version} is PUBLISHED"
                echo "$deployment" > guard-core-engine-deployment-id.txt
                exit 0
                ;;
              FAILED)
                curl -sS -X POST -H "Authorization: Bearer ${token}" \
                  "https://central.sonatype.com/api/v1/publisher/status?id=${deployment}" | jq .
                echo "guard-core-engine deployment failed Portal validation"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "guard-core-engine validation did not settle in 15 minutes; inspect deployment ${deployment} in the Portal UI, then re-drive this workflow"
          exit 1

      # Facade second: the deployment only goes up after the engine deployment
      # is VALIDATED (the within-lane ordering rule).
      - name: Build the guard-core staging bundle
        if: steps.artifacts.outputs.facade == 'publish'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew :guard-core:publishMavenPublicationToCentralStagingRepository --no-daemon

      - name: Upload and validate the guard-core deployment
        if: steps.artifacts.outputs.facade == 'publish'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f guard-core-engine-deployment-id.txt ]; then
            echo "engine deployment $(cat guard-core-engine-deployment-id.txt) is VALIDATED; proceeding with the facade"
          fi
          version="${TAG#v}"
          token=$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 | tr -d '\n')
          rm -f central-bundle.zip
          (cd guard-core/build/central-staging && zip -qr "$GITHUB_WORKSPACE/central-bundle.zip" .)
          deployment=""
          for attempt in 1 2 3; do
            response=$(curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer ${token}" \
              -F "bundle=@central-bundle.zip;type=application/octet-stream" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=guard-core-${version}&publishingType=USER_MANAGED") \
              && deployment=$(printf '%s' "$response" | tr -d '[:space:]') && break
            echo "upload attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          if [ -z "$deployment" ] || [ "$deployment" = "null" ]; then
            echo "guard-core upload failed after 3 attempts"
            exit 1
          fi
          echo "guard-core deployment: ${deployment}"
          for _ in $(seq 1 30); do
            state=$(curl -sS -X POST \
              -H "Authorization: Bearer ${token}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment}" | jq -r '.deploymentState' || true)
            echo "validation state: ${state}"
            case "$state" in
              VALIDATED)
                echo "guard-core ${version} is VALIDATED; release BOTH deployments from the Portal UI (engine first, facade second)"
                exit 0
                ;;
              PUBLISHED)
                echo "guard-core ${version} is PUBLISHED"
                exit 0
                ;;
              FAILED)
                curl -sS -X POST -H "Authorization: Bearer ${token}" \
                  "https://central.sonatype.com/api/v1/publisher/status?id=${deployment}" | jq .
                echo "guard-core deployment failed Portal validation"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "guard-core validation did not settle in 15 minutes; inspect deployment ${deployment} in the Portal UI, then re-drive this workflow"
          exit 1

      - name: Summary
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "Publish run for ${version} finished. Operator steps:"
          echo "  1. Release every VALIDATED deployment in the Portal UI (central.sonatype.com, Deployments): engine first, facade second."
          echo "  2. Wait for the artifacts to reach repo1.maven.org (the release workflows for the adapters and the agent check this)."
          echo "  3. Run the post-release audits in docs/release.md (release page per tag, registry existence checks)."
