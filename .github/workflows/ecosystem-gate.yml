name: Ecosystem Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      consumer_ref:
        description: 'Consumer ref to test against: empty = default branch HEAD, or an explicit ref'
        required: false
        default: ''

concurrency:
  group: ecosystem-gate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  consumer-test:
    name: ${{ matrix.consumer.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        consumer:
          - repo: Guard-Core/spring-boot-guard
            path: adapter
          - repo: Guard-Core/ktor-guard
            path: adapter

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The adapters resolve their engine via the composite build (settings
      # gradle checks ./guard-core-jvm and ../guard-core-jvm). The gate
      # checks THIS guard-core-jvm checkout out as the adapter's parent
      # sibling, so the suite always runs against the engine change under
      # test, not the adapter's pinned ref.
      GUARD_CORE_JVM_REF: ${{ github.sha }}

    steps:
      - name: Checkout guard-core-jvm (engine under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: guard-core-jvm
          persist-credentials: false

      - name: Checkout ${{ matrix.consumer.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.consumer.repo }}
          ref: ${{ github.event.inputs.consumer_ref }}
          path: adapter
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Run the consumer test suite against this guard-core-jvm checkout
        working-directory: adapter
        run: ./gradlew test --no-daemon
